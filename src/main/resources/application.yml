server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}

spring:
  application:
    name: internal-outsourcing-management
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/pta_outsourcing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:pta}
    password: ${DB_PASSWORD:pta123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:pta}
    password: ${RABBITMQ_PASSWORD:pta123456}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false
  thymeleaf:
    cache: false
    mode: HTML

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:pta-outsourcing-demo-secret-key-must-be-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  security:
    session-prefix: pta:login:jti
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:true}
    url: ${ELASTICSEARCH_URL:http://localhost:9200}
    index-name: ${ELASTICSEARCH_INDEX_NAME:pta-operation-logs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: false
  setting:
    language: zh_cn

logging:
  level:
    com.pta.outsourcing: info
    org.springframework.security: warn
