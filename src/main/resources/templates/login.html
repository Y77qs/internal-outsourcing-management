<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 内部测试外包人员管理系统</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="login" class="auth-page">
<main class="container auth-shell">
    <div class="row align-items-center g-4">
        <section class="col-lg-6 auth-intro">
            <div class="app-brand bg-transparent border-0 px-0 mb-4">
                <span class="brand-mark"><i class="bi bi-diagram-3"></i></span>
                <span>内部测试外包管理</span>
            </div>
            <h1 class="display-6 fw-bold mb-3">人员、审批与审计集中管理</h1>
            <p class="text-secondary mb-0">login</p>
        </section>
        <section class="col-lg-6">
            <div class="auth-box panel p-4 p-md-5">
                <h2 class="h4 mb-1">账号登录</h2>
                <p class="form-help mb-4">使用系统账号进入工作台</p>
                <div id="alert" class="alert d-none" role="alert"></div>
                <form id="loginForm" class="vstack gap-3">
                    <div>
                        <label for="username" class="form-label">用户名</label>
                        <input id="username" name="username" class="form-control" autocomplete="username" required>
                    </div>
                    <div>
                        <label for="password" class="form-label">密码</label>
                        <input id="password" name="password" type="password" class="form-control"
                               autocomplete="current-password" required>
                    </div>
                    <button class="btn btn-primary w-100 btn-icon justify-content-center" type="submit">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <span>登录</span>
                    </button>
                </form>
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="/ui/register">注册测试外包账号</a>
                    <a href="/doc.html">Knife4j</a>
                </div>
            </div>
        </section>
    </div>
</main>
<script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
