<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 内部测试外包人员管理系统</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="login" class="auth-page">
<main class="auth-card">
    <header class="text-center">
        <span class="auth-logo"><i class="bi bi-hexagon-fill"></i></span>
        <h1 class="auth-title">内部测试外包管理</h1>
        <p class="auth-copy">统一处理账号、上岗申请、领导审批、通知和审计任务。</p>
    </header>
    <section class="mt-4 pt-2">
        <h2 class="h5 fw-bold mb-1 text-center">账号登录</h2>
        <p class="text-center text-secondary mb-4">使用系统账号进入工作台</p>
        <div id="alert" class="alert d-none" role="alert"></div>
        <form id="loginForm" class="vstack gap-3">
            <div>
                <label for="username" class="form-label">用户名</label>
                <div class="input-icon">
                    <i class="bi bi-person"></i>
                    <input id="username" name="username" class="form-control" placeholder="请输入用户名"
                           autocomplete="username" required>
                </div>
            </div>
            <div>
                <label for="password" class="form-label">密码</label>
                <div class="input-icon">
                    <i class="bi bi-lock"></i>
                    <input id="password" name="password" type="password" class="form-control" placeholder="请输入密码"
                           autocomplete="current-password" required>
                </div>
            </div>
            <button class="btn btn-primary w-100 btn-icon mt-2" type="submit">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>登录</span>
            </button>
        </form>
        <div class="auth-links">
            <a href="/ui/register">注册测试外包账号</a>
            <a href="/doc.html">接口文档</a>
        </div>
    </section>
</main>
<script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
