<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>领导审批 - 内部测试外包人员管理系统</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="approvals">
<div class="app-layout">
    <aside class="app-sidebar d-none d-lg-flex flex-column">
        <div class="app-brand">
            <span class="brand-mark"><i class="bi bi-diagram-3"></i></span>
            <span>外包管理</span>
        </div>
        <nav class="app-nav-group">
            <a class="app-nav-link" href="/ui/dashboard"><i class="bi bi-speedometer2"></i><span>工作台</span></a>
            <a class="app-nav-link" href="/ui/applications" data-permission="application:read:self">
                <i class="bi bi-file-earmark-plus"></i><span>上岗申请</span>
            </a>
            <a class="app-nav-link active" href="/ui/approvals" data-permission="approval:read">
                <i class="bi bi-check2-square"></i><span>领导审批</span>
            </a>
            <a class="app-nav-link" href="/ui/users" data-permission="user:read">
                <i class="bi bi-people"></i><span>用户管理</span>
            </a>
            <a class="app-nav-link" href="/ui/notifications" data-permission="notification:read">
                <i class="bi bi-bell"></i><span>通知消息</span>
            </a>
            <a class="app-nav-link" href="/ui/operation-logs" data-permission="operation:read">
                <i class="bi bi-journal-text"></i><span>操作日志</span>
            </a>
            <a class="app-nav-link" href="/doc.html"><i class="bi bi-braces"></i><span>Knife4j</span></a>
        </nav>
    </aside>
    <div class="app-main">
        <header class="app-topbar">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary icon-only d-lg-none" type="button"
                        data-bs-toggle="offcanvas" data-bs-target="#mobileNav" aria-label="打开导航">
                    <i class="bi bi-list"></i>
                </button>
                <span class="fw-semibold d-lg-none">外包管理</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span id="currentUser" class="text-secondary"></span>
                <button id="logoutButton" class="btn btn-outline-secondary btn-sm btn-icon" type="button">
                    <i class="bi bi-box-arrow-right"></i><span>退出</span>
                </button>
            </div>
        </header>
        <main class="app-content">
            <div id="alert" class="alert d-none" role="alert"></div>
            <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>
            <div class="page-header">
                <div>
                    <h1 class="page-title">领导审批</h1>
                    <p class="page-subtitle">待审批上岗申请</p>
                </div>
                <button id="reloadApprovals" class="btn btn-outline-secondary btn-icon" type="button">
                    <i class="bi bi-arrow-clockwise"></i><span>刷新</span>
                </button>
            </div>
            <section class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">待审批列表</h2>
                    <span id="pendingCount" class="text-secondary small"></span>
                </div>
                <div id="batchBar" class="batch-bar d-none">
                    <div class="fw-semibold">
                        已选择 <span id="selectedApprovalCount">0</span> 项
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <select id="batchResult" class="form-select form-select-sm w-auto">
                            <option value="APPROVED">通过</option>
                            <option value="REJECTED">驳回</option>
                        </select>
                        <input id="batchOpinion" class="form-control form-control-sm w-auto" placeholder="审批意见">
                        <button id="batchSubmit" class="btn btn-primary btn-sm btn-icon" type="button">
                            <i class="bi bi-check2-all"></i><span>批量处理</span>
                        </button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th style="width: 44px;">
                                <input id="checkAllApprovals" class="form-check-input" type="checkbox"
                                       aria-label="全选申请">
                            </th>
                            <th>ID</th>
                            <th>申请人</th>
                            <th>部门</th>
                            <th>项目</th>
                            <th>岗位</th>
                            <th>提交时间</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="approvalRows"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<div id="rejectModal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title h5">驳回申请</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <input id="rejectApplicationId" type="hidden">
                <label for="rejectOpinion" class="form-label">审批意见</label>
                <textarea id="rejectOpinion" class="form-control" rows="4" required></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button id="confirmReject" class="btn btn-danger btn-icon" type="button">
                    <i class="bi bi-x-circle"></i><span>确认驳回</span>
                </button>
            </div>
        </div>
    </div>
</div>
<div id="mobileNav" class="offcanvas offcanvas-start" tabindex="-1">
    <div class="offcanvas-header">
        <h2 class="h5 offcanvas-title">外包管理</h2>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="关闭"></button>
    </div>
    <div class="offcanvas-body p-0">
        <nav class="app-nav-group">
            <a class="app-nav-link" href="/ui/dashboard"><i class="bi bi-speedometer2"></i><span>工作台</span></a>
            <a class="app-nav-link" href="/ui/applications" data-permission="application:read:self">
                <i class="bi bi-file-earmark-plus"></i><span>上岗申请</span>
            </a>
            <a class="app-nav-link active" href="/ui/approvals" data-permission="approval:read">
                <i class="bi bi-check2-square"></i><span>领导审批</span>
            </a>
            <a class="app-nav-link" href="/ui/users" data-permission="user:read">
                <i class="bi bi-people"></i><span>用户管理</span>
            </a>
            <a class="app-nav-link" href="/ui/notifications" data-permission="notification:read">
                <i class="bi bi-bell"></i><span>通知消息</span>
            </a>
            <a class="app-nav-link" href="/ui/operation-logs" data-permission="operation:read">
                <i class="bi bi-journal-text"></i><span>操作日志</span>
            </a>
            <a class="app-nav-link" href="/doc.html"><i class="bi bi-braces"></i><span>Knife4j</span></a>
        </nav>
    </div>
</div>
<script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
