<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>工作台 - 内部测试外包人员管理系统</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="dashboard">
<div class="app-layout">
    <aside class="app-sidebar d-none d-lg-flex flex-column">
        <div class="app-brand">
            <span class="brand-mark"><i class="bi bi-diagram-3"></i></span>
            <span>外包管理</span>
        </div>
        <nav class="app-nav-group">
            <a class="app-nav-link active" href="/ui/dashboard"><i class="bi bi-speedometer2"></i><span>工作台</span></a>
            <a class="app-nav-link" href="/ui/applications" data-permission="application:read:self">
                <i class="bi bi-file-earmark-plus"></i><span>上岗申请</span>
            </a>
            <a class="app-nav-link" href="/ui/approvals" data-permission="approval:read">
                <i class="bi bi-check2-square"></i><span>领导审批</span>
            </a>
            <a class="app-nav-link" href="/ui/users" data-permission="user:read">
                <i class="bi bi-people"></i><span>用户管理</span>
            </a>
            <a class="app-nav-link" href="/ui/notifications" data-permission="notification:read">
                <i class="bi bi-bell"></i><span>通知消息</span>
            </a>
            <a class="app-nav-link" href="/ui/operation-logs" data-permission="operation:read">
                <i class="bi bi-journal-text"></i><span>操作日志</span>
            </a>
            <a class="app-nav-link" href="/doc.html"><i class="bi bi-braces"></i><span>Knife4j</span></a>
        </nav>
    </aside>
    <div class="app-main">
        <header class="app-topbar">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary icon-only d-lg-none" type="button"
                        data-bs-toggle="offcanvas" data-bs-target="#mobileNav" aria-label="打开导航">
                    <i class="bi bi-list"></i>
                </button>
                <span class="fw-semibold d-lg-none">外包管理</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span id="currentUser" class="text-secondary"></span>
                <button id="logoutButton" class="btn btn-outline-secondary btn-sm btn-icon" type="button">
                    <i class="bi bi-box-arrow-right"></i><span>退出</span>
                </button>
            </div>
        </header>
        <main class="app-content">
            <div id="alert" class="alert d-none" role="alert"></div>
            <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>
            <div class="page-header">
                <div>
                    <h1 class="page-title">工作台</h1>
                    <p class="page-subtitle">内部测试外包人员管理系统</p>
                </div>
                <div class="text-secondary" id="healthStatus">检查中</div>
            </div>
            <section class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="panel panel-body h-100">
                        <div class="d-flex align-items-center gap-3">
                            <span class="brand-mark"><i class="bi bi-person-badge"></i></span>
                            <div>
                                <div class="text-secondary small">当前角色</div>
                                <div id="roleLine" class="fw-semibold"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="panel panel-body h-100">
                        <div class="d-flex align-items-center gap-3">
                            <span class="brand-mark"><i class="bi bi-hdd-network"></i></span>
                            <div>
                                <div class="text-secondary small">服务状态</div>
                                <div class="fw-semibold">Spring Boot / MySQL / Redis / RabbitMQ</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="row g-3">
                <div class="col-md-6 col-xl-3" data-permission="application:create">
                    <a class="panel panel-body d-block text-decoration-none text-body h-100" href="/ui/applications">
                        <i class="bi bi-file-earmark-plus fs-3 text-success"></i>
                        <div class="fw-semibold mt-3">上岗申请</div>
                        <div class="text-secondary small">申请、状态、撤回</div>
                    </a>
                </div>
                <div class="col-md-6 col-xl-3" data-permission="approval:read">
                    <a class="panel panel-body d-block text-decoration-none text-body h-100" href="/ui/approvals">
                        <i class="bi bi-check2-square fs-3 text-primary"></i>
                        <div class="fw-semibold mt-3">领导审批</div>
                        <div class="text-secondary small">待办、通过、驳回</div>
                    </a>
                </div>
                <div class="col-md-6 col-xl-3" data-permission="user:read">
                    <a class="panel panel-body d-block text-decoration-none text-body h-100" href="/ui/users">
                        <i class="bi bi-people fs-3 text-warning"></i>
                        <div class="fw-semibold mt-3">用户管理</div>
                        <div class="text-secondary small">账号、角色、状态</div>
                    </a>
                </div>
                <div class="col-md-6 col-xl-3" data-permission="operation:read">
                    <a class="panel panel-body d-block text-decoration-none text-body h-100"
                       href="/ui/operation-logs">
                        <i class="bi bi-journal-text fs-3 text-danger"></i>
                        <div class="fw-semibold mt-3">操作日志</div>
                        <div class="text-secondary small">行为、结果、审计</div>
                    </a>
                </div>
            </section>
        </main>
    </div>
</div>
<div id="mobileNav" class="offcanvas offcanvas-start" tabindex="-1">
    <div class="offcanvas-header">
        <h2 class="h5 offcanvas-title">外包管理</h2>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="关闭"></button>
    </div>
    <div class="offcanvas-body p-0">
        <nav class="app-nav-group">
            <a class="app-nav-link active" href="/ui/dashboard"><i class="bi bi-speedometer2"></i><span>工作台</span></a>
            <a class="app-nav-link" href="/ui/applications" data-permission="application:read:self">
                <i class="bi bi-file-earmark-plus"></i><span>上岗申请</span>
            </a>
            <a class="app-nav-link" href="/ui/approvals" data-permission="approval:read">
                <i class="bi bi-check2-square"></i><span>领导审批</span>
            </a>
            <a class="app-nav-link" href="/ui/users" data-permission="user:read">
                <i class="bi bi-people"></i><span>用户管理</span>
            </a>
            <a class="app-nav-link" href="/ui/notifications" data-permission="notification:read">
                <i class="bi bi-bell"></i><span>通知消息</span>
            </a>
            <a class="app-nav-link" href="/ui/operation-logs" data-permission="operation:read">
                <i class="bi bi-journal-text"></i><span>操作日志</span>
            </a>
            <a class="app-nav-link" href="/doc.html"><i class="bi bi-braces"></i><span>Knife4j</span></a>
        </nav>
    </div>
</div>
<script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
