<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册 - 内部测试外包人员管理系统</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="register" class="auth-page">
<main class="auth-card auth-card-wide">
    <header class="text-center">
        <span class="auth-logo"><i class="bi bi-person-badge"></i></span>
        <h1 class="auth-title">测试外包人员注册</h1>
        <p class="auth-copy">公开注册仅创建测试外包人员账号，注册成功后自动进入工作台。</p>
    </header>
    <section class="mt-4 pt-2">
        <div id="alert" class="alert d-none" role="alert"></div>
        <form id="registerForm" class="row g-3">
            <div class="col-md-6">
                <label for="username" class="form-label">用户名</label>
                <div class="input-icon">
                    <i class="bi bi-person"></i>
                    <input id="username" name="username" class="form-control" placeholder="请输入用户名"
                           required maxlength="64">
                </div>
            </div>
            <div class="col-md-6">
                <label for="password" class="form-label">密码</label>
                <div class="input-icon">
                    <i class="bi bi-lock"></i>
                    <input id="password" name="password" type="password" class="form-control"
                           placeholder="至少 8 位" required minlength="8" maxlength="32">
                </div>
            </div>
            <div class="col-md-6">
                <label for="realName" class="form-label">真实姓名</label>
                <div class="input-icon">
                    <i class="bi bi-person-vcard"></i>
                    <input id="realName" name="realName" class="form-control" placeholder="请输入真实姓名"
                           maxlength="64">
                </div>
            </div>
            <div class="col-md-6">
                <label for="phone" class="form-label">手机号</label>
                <div class="input-icon">
                    <i class="bi bi-phone"></i>
                    <input id="phone" name="phone" class="form-control" placeholder="请输入手机号" maxlength="32">
                </div>
            </div>
            <div class="col-12">
                <label for="email" class="form-label">邮箱</label>
                <div class="input-icon">
                    <i class="bi bi-envelope"></i>
                    <input id="email" name="email" type="email" class="form-control" placeholder="请输入邮箱">
                </div>
            </div>
            <div class="col-12">
                <button class="btn btn-primary w-100 btn-icon mt-2" type="submit">
                    <i class="bi bi-check2-circle"></i>
                    <span>注册并进入工作台</span>
                </button>
            </div>
        </form>
        <div class="auth-links justify-content-center">
            <a href="/ui/login">返回登录</a>
        </div>
    </section>
</main>
<script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
