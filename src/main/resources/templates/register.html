<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册 - 内部测试外包人员管理系统</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="register" class="auth-page">
<main class="container auth-shell">
    <div class="row align-items-center g-4">
        <section class="col-lg-6 auth-intro">
            <div class="app-brand bg-transparent border-0 px-0 mb-4">
                <span class="brand-mark"><i class="bi bi-person-badge"></i></span>
                <span>测试外包人员注册</span>
            </div>
            <h1 class="display-6 fw-bold mb-3">提交申请前先完成账号建立</h1>
            <p class="text-secondary mb-0">公开注册账号默认授予测试外包人员角色</p>
        </section>
        <section class="col-lg-6">
            <div class="auth-box panel p-4 p-md-5">
                <h2 class="h4 mb-1">注册账号</h2>
                <p class="form-help mb-4">注册成功后自动进入工作台</p>
                <div id="alert" class="alert d-none" role="alert"></div>
                <form id="registerForm" class="vstack gap-3">
                    <div>
                        <label for="username" class="form-label">用户名</label>
                        <input id="username" name="username" class="form-control" required maxlength="64">
                    </div>
                    <div>
                        <label for="password" class="form-label">密码</label>
                        <input id="password" name="password" type="password" class="form-control" required
                               minlength="8" maxlength="32">
                    </div>
                    <div>
                        <label for="realName" class="form-label">真实姓名</label>
                        <input id="realName" name="realName" class="form-control" maxlength="64">
                    </div>
                    <div>
                        <label for="phone" class="form-label">手机号</label>
                        <input id="phone" name="phone" class="form-control" maxlength="32">
                    </div>
                    <div>
                        <label for="email" class="form-label">邮箱</label>
                        <input id="email" name="email" type="email" class="form-control">
                    </div>
                    <button class="btn btn-primary w-100 btn-icon justify-content-center" type="submit">
                        <i class="bi bi-check2-circle"></i>
                        <span>注册并进入工作台</span>
                    </button>
                </form>
                <div class="mt-4">
                    <a href="/ui/login">返回登录</a>
                </div>
            </div>
        </section>
    </div>
</main>
<script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
