<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>上岗申请 - 内部测试外包人员管理系统</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="applications">
<div class="app-layout">
    <aside class="app-sidebar d-none d-lg-flex flex-column">
        <div class="app-brand">
            <span class="brand-mark"><i class="bi bi-hexagon-fill"></i></span>
            <div class="brand-copy">
                <h1 class="brand-title">外包管理</h1>
                <div class="brand-subtitle">内部管理平台</div>
            </div>
        </div>
        <div class="sidebar-primary-action" data-permission="application:create">
            <button class="btn btn-primary btn-icon w-100" type="button" data-bs-toggle="modal"
                    data-bs-target="#applicationModal">
                <i class="bi bi-plus-lg"></i><span>新建上岗申请</span>
            </button>
        </div>
        <nav class="app-nav-group">
            <a class="app-nav-link" href="/ui/dashboard"><i class="bi bi-grid-1x2"></i><span>工作台</span></a>
            <a class="app-nav-link active" href="/ui/applications" data-permission="application:read:self">
                <i class="bi bi-file-earmark-text"></i><span>上岗申请</span>
            </a>
            <a class="app-nav-link" href="/ui/approvals" data-permission="approval:read">
                <i class="bi bi-ui-checks"></i><span>领导审批</span>
            </a>
            <a class="app-nav-link" href="/ui/work-logs"
               data-permission-any="worklog:read:self,worklog:read:all">
                <i class="bi bi-journal-text"></i><span>工作日志</span>
            </a>
            <a class="app-nav-link" href="/ui/performances"
               data-permission-any="performance:read:self,performance:read">
                <i class="bi bi-award"></i><span>绩效管理</span>
            </a>
            <a class="app-nav-link" href="/ui/users" data-permission="user:read">
                <i class="bi bi-people"></i><span>用户管理</span>
            </a>
            <a class="app-nav-link" href="/ui/notifications" data-permission="notification:read">
                <i class="bi bi-bell"></i><span>通知消息</span>
            </a>
            <a class="app-nav-link" href="/ui/operation-logs" data-permission="operation:read">
                <i class="bi bi-clock-history"></i><span>操作日志</span>
            </a>
        </nav>
        <div class="app-sidebar-footer">
            <a class="app-nav-link" href="/doc.html"><i class="bi bi-braces"></i><span>接口文档</span></a>
        </div>
    </aside>
    <div class="app-main">
        <header class="app-topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-outline-secondary icon-only d-lg-none" type="button"
                        data-bs-toggle="offcanvas" data-bs-target="#mobileNav" aria-label="打开导航">
                    <i class="bi bi-list"></i>
                </button>
                <h2 class="topbar-title">Applications</h2>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="topbar-search">
                    <i class="bi bi-search"></i>
                    <input class="form-control" placeholder="搜索申请或项目" type="search">
                </div>
                <a class="icon-circle topbar-utility position-relative" href="/ui/notifications"
                   data-permission="notification:read" aria-label="通知消息">
                    <i class="bi bi-bell"></i>
                    <span class="position-absolute top-0 end-0 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
                </a>
                <a class="icon-circle topbar-utility" href="/doc.html" aria-label="接口文档">
                    <i class="bi bi-grid-3x3-gap"></i>
                </a>
                <div class="topbar-user">
                    <span class="user-avatar"><i class="bi bi-person"></i></span>
                    <span id="currentUser" class="fw-semibold"></span>
                </div>
                <button id="logoutButton" class="btn btn-outline-secondary btn-sm btn-icon" type="button">
                    <i class="bi bi-box-arrow-right"></i><span>退出</span>
                </button>
            </div>
        </header>
        <main class="app-content">
            <div class="content-shell">
                <div id="alert" class="alert d-none" role="alert"></div>
                <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>
                <div class="page-header">
                    <div>
                        <div class="page-eyebrow">APPLICATIONS</div>
                        <h1 class="page-title">上岗申请列表</h1>
                        <p class="page-subtitle">查看个人申请记录，并对待审批申请进行撤回。</p>
                    </div>
                    <button class="btn btn-primary btn-icon" type="button" data-bs-toggle="modal"
                            data-bs-target="#applicationModal" data-permission="application:create">
                        <i class="bi bi-plus-lg"></i><span>新建申请</span>
                    </button>
                </div>
                <section class="panel">
                    <div class="panel-header">
                        <div>
                            <h2 class="panel-title">我的申请</h2>
                            <p class="panel-subtitle">按提交时间展示最近的上岗申请。</p>
                        </div>
                        <div class="toolbar-actions">
                            <button id="reloadApplications" class="btn btn-outline-secondary btn-icon" type="button">
                                <i class="bi bi-arrow-clockwise"></i><span>刷新</span>
                            </button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>项目</th>
                                <th>岗位</th>
                                <th>状态</th>
                                <th>提交时间</th>
                                <th>审批意见</th>
                                <th class="text-end">操作</th>
                            </tr>
                            </thead>
                            <tbody id="applicationRows"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>
</div>
<div id="applicationModal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form id="applicationForm">
                <div class="modal-header">
                    <div>
                        <h2 class="modal-title h5 fw-bold">新建上岗申请</h2>
                        <p class="text-secondary mb-0 small">选择部门与项目后提交申请原因。</p>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="departmentId" class="form-label">所属部门</label>
                            <select id="departmentId" name="departmentId" class="form-select" required></select>
                        </div>
                        <div class="col-md-6">
                            <label for="projectId" class="form-label">项目</label>
                            <select id="projectId" name="projectId" class="form-select" required></select>
                        </div>
                        <div class="col-12">
                            <label for="positionType" class="form-label">岗位类型</label>
                            <input id="positionType" name="positionType" class="form-control" value="功能测试" required>
                        </div>
                        <div class="col-12">
                            <label for="applicationReason" class="form-label">申请原因</label>
                            <textarea id="applicationReason" name="applicationReason" class="form-control" rows="4"
                                      required>参与内部测试外包人员管理系统功能测试</textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    <button class="btn btn-primary btn-icon" type="submit">
                        <i class="bi bi-send"></i><span>提交申请</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<div id="mobileNav" class="offcanvas offcanvas-start" tabindex="-1">
    <div class="offcanvas-header">
        <div class="d-flex align-items-center gap-2">
            <span class="brand-mark"><i class="bi bi-hexagon-fill"></i></span>
            <h2 class="h5 offcanvas-title mb-0">外包管理</h2>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="关闭"></button>
    </div>
    <div class="offcanvas-body p-0 d-flex flex-column">
        <div class="sidebar-primary-action" data-permission="application:create">
            <button class="btn btn-primary btn-icon w-100" type="button" data-bs-toggle="modal"
                    data-bs-target="#applicationModal">
                <i class="bi bi-plus-lg"></i><span>新建上岗申请</span>
            </button>
        </div>
        <nav class="app-nav-group">
            <a class="app-nav-link" href="/ui/dashboard"><i class="bi bi-grid-1x2"></i><span>工作台</span></a>
            <a class="app-nav-link active" href="/ui/applications" data-permission="application:read:self">
                <i class="bi bi-file-earmark-text"></i><span>上岗申请</span>
            </a>
            <a class="app-nav-link" href="/ui/approvals" data-permission="approval:read">
                <i class="bi bi-ui-checks"></i><span>领导审批</span>
            </a>
            <a class="app-nav-link" href="/ui/work-logs"
               data-permission-any="worklog:read:self,worklog:read:all">
                <i class="bi bi-journal-text"></i><span>工作日志</span>
            </a>
            <a class="app-nav-link" href="/ui/performances"
               data-permission-any="performance:read:self,performance:read">
                <i class="bi bi-award"></i><span>绩效管理</span>
            </a>
            <a class="app-nav-link" href="/ui/users" data-permission="user:read">
                <i class="bi bi-people"></i><span>用户管理</span>
            </a>
            <a class="app-nav-link" href="/ui/notifications" data-permission="notification:read">
                <i class="bi bi-bell"></i><span>通知消息</span>
            </a>
            <a class="app-nav-link" href="/ui/operation-logs" data-permission="operation:read">
                <i class="bi bi-clock-history"></i><span>操作日志</span>
            </a>
        </nav>
        <div class="app-sidebar-footer">
            <a class="app-nav-link" href="/doc.html"><i class="bi bi-braces"></i><span>接口文档</span></a>
        </div>
    </div>
</div>
<script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
