name: Week3 CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Unit tests
        run: ./mvnw -q test

      - name: Checkstyle
        run: ./mvnw -q checkstyle:check

      - name: Verify
        run: ./mvnw -q verify

      - name: Docker Compose config
        run: docker compose config -q

      - name: Docker build
        run: docker build -t pta/internal-outsourcing-management:ci .
